.gl-msg{min-height:1.5em;max-width:80ch;font-weight:650;margin:.5em 0}
.gl-msg p{margin:.2em 0}
.gl-lines{margin:.3em 0 .3em 1.2em;padding:0;max-width:80ch;overflow-wrap:anywhere}
.gl-tabs{display:flex;flex-wrap:wrap;margin:10px 0 6px}
.gl-tabs .btn{margin:0 8px 8px 0;min-height:44px}
.gl-box{margin:8px 0;min-width:0}
.gl-box h3{margin:1.1em 0 .4em}
.gl-box h4{margin:.9em 0 .3em}
.gl-bar{display:flex;flex-wrap:wrap;align-items:flex-end;margin:10px 0}
.gl-bar>*{margin:0 10px 8px 0;min-width:0;max-width:100%}
.gl-bar .btn{min-height:44px}
.gl-f{display:flex;flex-direction:column;font-size:.88rem;color:var(--mut);min-width:0;max-width:100%;margin:0 12px 10px 0}
.gl-f>label{font-weight:650;margin-bottom:4px}
.gl-inp{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;font:inherit;font-size:1rem;min-height:44px;padding:6px 10px;max-width:100%;min-width:0;box-sizing:border-box}
.gl-inp:hover{border-color:var(--ac)}
.sel.gl-inp{max-width:100%}
textarea.gl-inp{display:block;width:100%;max-width:80ch;line-height:1.45;resize:vertical}
input.gl-inp[type="text"]{width:100%;max-width:34rem}
.gl-check{display:inline-flex;align-items:center;margin:4px 16px 8px 0;min-height:32px;cursor:pointer}
.gl-check input{margin:0 8px 0 0;width:20px;height:20px}
.gl-count{color:var(--mut);margin:.6em 0;max-width:80ch}
.gl-empty{color:var(--mut);max-width:80ch}
.gl-list{list-style:none;margin:8px 0;padding:0;max-width:80ch}
.gl-entry{margin:10px 0;padding:10px 14px;border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:10px;background:var(--card);overflow-wrap:anywhere}
.gl-entry:focus{outline:3px solid var(--ac);outline-offset:2px}
.gl-head{font-size:1.15rem}
.gl-word{font-weight:750}
.gl-var{color:var(--mut);font-size:.95rem}
.gl-meta{color:var(--mut);font-size:.88rem;margin:.2em 0}
.gl-badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:.8rem;color:var(--tx);background:var(--bg2)}
.gl-st-sourced{border-color:var(--ac)}
.gl-st-reviewed{border-color:#2e9d4a;font-weight:650}
.gl-yours{border-style:dashed}
.gl-gloss{margin:.3em 0}
.gl-notes{margin:.4em 0;color:var(--mut);white-space:pre-wrap}
.gl-exh{font-weight:650;margin-top:.4em}
.gl-ex{margin:.2em 0 .2em 1.2em;padding:0}
.gl-src{font-size:.86rem;color:var(--mut);margin:.4em 0;overflow-wrap:anywhere}
.gl-play{min-height:40px;padding:6px 14px;margin:4px 0 0}
.gl-have{margin:.3em 0 .6em 1.2em;padding:0;max-width:80ch}
.gl-tblw{position:relative;max-width:100%;overflow-x:auto}
.gl-tblw:focus{outline:3px solid var(--ac);outline-offset:2px}
.gl-table{margin:14px 0;table-layout:fixed;min-width:34rem}
.gl-table th:first-child{width:24%}
.gl-table td,.gl-table th[scope="row"]{vertical-align:middle}
.gl-capt{text-align:left;font-weight:700;padding:6px 10px;color:var(--tx)}
.gl-table thead th{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.gl-table th[scope="row"]{text-align:left;color:var(--tx);font-size:.93rem;font-weight:650;text-transform:none;letter-spacing:0;padding:9px 10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.gl-table td{overflow-wrap:anywhere}
.gl-addbtn{min-height:44px;padding:4px 12px}
.gl-have-cell{font-weight:650}
.gl-off,.gl-file{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gl-filelab{cursor:pointer}
.gl-file:focus+.gl-filelab{outline:3px solid var(--ac);outline-offset:2px}
.gl-file:focus-visible+.gl-filelab{outline:3px solid var(--ac);outline-offset:2px}
.gl-more summary{cursor:pointer;font-weight:650;min-height:32px;margin:6px 0}
.gl-more .gl-f{margin-top:6px}
.gl-audio{margin:12px 0}
.gl-check-out{max-width:80ch;margin:.4em 0}
.gl-custom{list-style:none;margin:8px 0;padding:0;max-width:80ch}
.gl-custom li{margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere}
.gl-cid{font-weight:650}
.gl-cmeta{color:var(--mut)}
.gl-custom .btn{min-height:40px;padding:6px 14px;margin:6px 8px 0 0}
.gl-steps{margin:.4em 0 .6em 1.4em;padding:0;max-width:80ch}
.gl-steps li{margin:.4em 0}
.gl-list-lim{max-width:80ch}
.gl-bad{color:#ffb4ab}
:root[data-theme="light"] .gl-bad{color:#8c1d18}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .gl-bad{color:#8c1d18}}
.gl-ok{color:#9be3a8;font-weight:650}
:root[data-theme="light"] .gl-ok{color:#14591f}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .gl-ok{color:#14591f}}
.gl-warn{font-weight:650}
@media (max-width:860px){.gl-inp{min-width:80px}}
</style>

e notează sistemul folosit, iar celelalte grafii sunt variante. Căutarea ignoră diacriticele («tinti» găsește «ținți»), dar nu știe că două grafii sunt același cuvânt decât dacă o variantă o spune.","lim_4":"Înregistrarea cere un browser care înregistrează în Opus (Chrome, Edge, Firefox). Safari înregistrează în alt format: folosește atunci un fișier Opus. Înregistrările sunt limitate la 50 KB.","lim_5":"Ce adaugi se păstrează doar în acest browser (localStorage, aproximativ 5 MB). Descarcă regulat contribuțiile; ștergerea datelor browserului le șterge și pe ele.","lim_6":"Traducerile interfeței au fost făcute cu un asistent IA și așteaptă verificarea unor vorbitori nativi; numele conceptelor există doar în engleză și în română."},"en":{"nav":"Dictionary","title":"Offline dictionaries for minority and endangered languages","open":"Open the dictionary","intro":"Search words in the languages of the index (Aromanian, Megleno-Romanian, Istro-Romanian, Romani) by word or by meaning, without worrying about diacritics; see what is missing from the basic list; add new words with a source and, if you like, an audio recording; export everything for Anki or a spreadsheet. Everything stays in this browser: nothing is sent and there are no accounts. The starter material is small and has not been reviewed by speakers: see “Limits”.","tab_search":"Search","tab_cover":"Coverage","tab_add":"Add","tab_export":"Export","tab_guide":"Guide","s_q_l":"Word or meaning (diacritics do not matter)","s_lang_l":"Language","s_all":"All languages","s_status_l":"Reliability","s_st_any":"any (including drafts)","s_st_sourced":"sourced or reviewed","s_st_reviewed":"reviewed by a speaker only","s_audio_l":"Only words with a recording","s_count":"{0} entries match (showing {1}).","s_none":"No entry matches. Try fewer letters. You can add the word in the “Add” tab.","s_more":"Show more","r_also":"also written","r_ex":"Examples","r_src":"Source","r_lic":"Licence","r_rev":"reviewed by {0}","r_play":"List cense":"Licence: 80 characters at most.","issue_other":"The entry is not valid.","m_title":"Your list ({0})","m_none":"You have not added anything yet.","m_dl1":"Download .json","m_dla":"Download audio","m_rm":"Remove","m_dlall":"Download everything (contribution file)","m_import":"Load a contribution file","m_imported":"{0} entries loaded, {1} skipped.","m_bad":"entry {0}: {1}","m_clear":"Clear the whole list","m_clear2":"Sure? Press again to clear the whole list","m_cleared":"The list was cleared.","m_removed":"Removed: {0}.","m_full":"The list already has {0} entries (the maximum). Download them and clear some.","b_title":"Add many words at once","b_help":"One per line: the word, then a tab, a semicolon or “=” and the meaning. Language, part of speech, spelling system, reliability and source are taken from the form above.","b_gl_l":"Language of the meanings","b_text_l":"Words and meanings","b_check":"Check the list","b_go":"Add {0} entries","b_sum":"{0} lines are fine, {1} have problems.","b_line":"line {0}: {1}","b_e_sep":"no separator (tab, “;” or “=”)","b_e_headword":"empty or too long word","b_e_gloss":"empty or too long meaning","b_e_many":"more than 200 lines; the rest is ignored","b_e_dup":"already in the dictionary or your list","b_added":"{0} entries added, {1} skipped.","x_title":"Export for learners","x_intro":"TSV opens in any spreadsheet. The Anki file imports into Anki (File → Import): the front of the card is the word, the back is the meanings.","x_scope_l":"Entries to export","x_all":"The dictionary and your list","x_dict":"The dictionary only","x_mine":"Your list only","x_tsv":"Download TSV","x_anki":"Download Anki file","x_count":"{0} entries will be exported.","x_none":"There is nothing to export.","x_done":"File downloaded: {0}","gd_title":"How to contribute (no coding needed)","gd_1":"In the “Add” tab, choose the language, then write the word and its meaning.","gd_2":"In “Source”, write where you know the word from (a book, a recording, a person and their village). Without a source the entry is not accepted.","gd_3":"If you can, record the word: press “Record”, say it once, calmly, then press “Stop”. 50 KB at most.","gd_4":"Press “Check”, then “Add to my list”. Repeat for each word, or paste a whole list under “Add many words at once”.","gd_5":"Press “Download everything” and send the file to the project: open an issue or a pull request on GitHub and attach it, or send it by email.","gd_6":"A maintainer turns it into data files with scripts/import_bundle.py; your name goes into the contributors list if you wish.","gd_st_h":"What the reliability levels mean","gd_st_draft":"Draft: entered, not yet checked by anyone else.","gd_st_sourced":"Sourced: copied from a published source named in “Source” (with a web address).","gd_st_reviewed":"Reviewed: confirmed by a speaker whose name is in “Reviewed by”.","gd_rec_h":"Recording tips","gd_rec_1":"A quiet room; the phone or headset microphone about a hand’s width from the mouth.","gd_rec_2":"One word, spoken naturally, with half a second of silence before and after; at most {0} seconds.","gd_rec_3":"Safari records in another format: record in Chrome, Edge or Firefox, or upload an Opus file made with another app.","gd_lic_h":"Licence and privacy","gd_lic":"What you contribute is published under the project licence unless you state another one in “Licence”. Record yourself or someone who agreed. Nothing is sent from this page.","e_big":"The file is too large (8 MB at most).","e_read":"The file could not be read.","e_quota":"The browser storage is full: download the list and delete what you no longer need.","e_format":"This is not a GLOSAR contribution file (format glosar-bundle, version 1).","e_many":"The file has too many entries (500 at most).","l_ro":"Romanian","l_en":"English","l_hu":"Hungarian","l_fr":"French","l_de":"German","l_it":"Italian","l_es":"Spanish","l_pt":"Portuguese","h_limits":"Limits and what it does not do","lim_1":"The built-in lists are starter material: numerals and a few words, each traced to a published source (Wikipedia, Wiktionary, the Angloromani dictionary at kratylos.org) and marked “sourced”. No speaker has reviewed them yet.","lim_2":"Aromanian, Megleno-Romanian and Romani have only a handful of words each, Istro-Romanian none yet. The basic list of 50 concepts is far from covered (see the “Coverage” tab).","lim_3":"Spelling systems differ between sources and between speakers: entries record the system used and list other spellings as variants. Search ignores diacritics (“tinti” finds “ținți”) but does not know that two spellings are the same word unless a variant says so.","lim_4":"Recording needs a browser that records Opus (Chrome, Edge, Firefox). Safari records in another format: use an Opus file instead. Recordings are limited to 50 KB.","lim_5":"What you add is kept in this browser only (localStorage, about 5 MB). Download your contributions regularly; clearing the browser data deletes them.","lim_6":"The interface translations were made with an AI assistant and await review by native speakers; concept names exist only in English and Romanian."},"fr":{"nav":"Glossaire","title":"Dictionnaires hors ligne pour les langues minoritaires et en danger","open":"Ouvrir le glossaire","intro":"Cherchez des mots dans les langues de l’index (aroumain, mégléno-roumain, istro-roumain, romani) par mot ou par sens, sans vous soucier des diacritiques ; voyez ce qui manque à la liste de base ; ajoutez de nouveaux mots avec une source et, si vous le souhaitez, un enregistrement audio ; exportez le tout pour Anki ou un tableur. Tout reste dans ce navigateur : rien n’est envoyé et il n’y a pas de comptes. Le matériau de départ est modeste et n’a pas été relu par des locuteurs : voir « Limites ».","tab_search":"Recherche","tab_cover":"Couverture","tab_add":"Ajout","tab_export":"Export","tab_guide":"Guide","s_q_l":"Mot ou sens (les diacritiques n’ont pas d’importance)","s_lang_l":"Langue","s_all":"Toutes les lan raphies comme variantes. La recherche ignore les diacritiques (« tinti » trouve « ținți ») mais ne sait pas que deux graphies sont le même mot si une variante ne le dit pas.","lim_4":"L’enregistrement exige un navigateur qui enregistre en Opus (Chrome, Edge, Firefox). Safari enregistre dans un autre format : utilisez alors un fichier Opus. Les enregistrements sont limités à 50 Ko.","lim_5":"Ce que vous ajoutez n’est conservé que dans ce navigateur (localStorage, environ 5 Mo). Téléchargez régulièrement vos contributions ; effacer les données du navigateur les supprime.","lim_6":"Les traductions de l’interface ont été faites avec un assistant d’IA et attendent la relecture de locuteurs natifs ; les noms des concepts n’existent qu’en anglais et en roumain."},"de":{"nav":"Wörterbuch","title":"Offline-Wörterbücher für Minderheiten- und bedrohte Sprachen","open":"Wörterbuch öffnen","intro":"Suchen Sie Wörter in den Sprachen des Index (Aromunisch, Meglenorumänisch, Istrorumänisch, Romani) nach Wort oder Bedeutung, ohne auf Diakritika zu achten; sehen Sie, was in der Grundliste fehlt; ergänzen Sie neue Wörter mit Quelle und, wenn Sie möchten, mit Tonaufnahme; exportieren Sie alles für Anki oder eine Tabellenkalkulation. Alles bleibt in diesem Browser: Es wird nichts gesendet und es gibt keine Konten. Das Startmaterial ist klein und wurde nicht von Sprechern geprüft: siehe „Grenzen“.","tab_search":"Suche","tab_cover":"Abdeckung","tab_add":"Hinzufügen","tab_export":"Export","tab_guide":"Anleitung","s_q_l":"Wort oder Bedeutung (Diakritika spielen keine Rolle)","s_lang_l":"Sprache","s_all":"Alle Sprachen","s_status_l":"Zuverlässigkeit","s_st_any":"beliebig (auch Entwürfe)","s_st_sourced":"mit Quelle oder geprüft","s_st_reviewed":"nur von Sprechern geprüft","s_audio_l":"Nur Wörter mit Aufnahme","s_count":"{0} Einträge passen (angezeigt: {1}).","s_none":"Kein Eintrag passt. Versuchen Sie weniger Buchstaben. Sie können das Wort im Reiter „Hinzufügen“ ergänzen.","s_more":"Mehr anz n Namen des Sprechers (höchstens 80 Zeichen).","issue_notes":"Anmerkung: höchstens 500 Zeichen.","issue_examples":"Beispiele: höchstens 10, jedes bis 300 Zeichen.","issue_audio":"Die Aufnahme hat kein zulässiges Format (Opus in Ogg oder WebM).","issue_audio_big":"Die Aufnahme ist größer als 50 KB.","issue_source":"Die Quelle ist Pflicht (höchstens 300 Zeichen).","issue_source_url":"Die Webadresse muss mit https:// beginnen (und ist für den Status „mit Quelle“ Pflicht).","issue_license":"Lizenz: höchstens 80 Zeichen.","issue_other":"Der Eintrag ist ungültig.","m_title":"Ihre Liste ({0})","m_none":"Sie haben noch nichts hinzugefügt.","m_dl1":".json herunterladen","m_dla":"Audio herunterladen","m_rm":"Entfernen","m_dlall":"Alles herunterladen (Beitragsdatei)","m_import":"Beitragsdatei laden","m_imported":"{0} Einträge geladen, {1} übersprungen.","m_bad":"Eintrag {0}: {1}","m_clear":"Gesamte Liste leeren","m_clear2":"Sicher? Erneut drücken, um die ganze Liste zu leeren","m_cleared":"Die Liste wurde geleert.","m_removed":"Entfernt: {0}.","m_full":"Die Liste hat schon {0} Einträge (das Maximum). Laden Sie sie herunter und löschen Sie einige.","b_title":"Viele Wörter auf einmal hinzufügen","b_help":"Eines pro Zeile: das Wort, dann Tabulator, Semikolon oder „=“ und die Bedeutung. Sprache, Wortart, Schreibsystem, Zuverlässigkeit und Quelle stammen aus dem Formular oben.","b_gl_l":"Sprache der Bedeutungen","b_text_l":"Wörter und Bedeutungen","b_check":"Liste prüfen","b_go":"{0} Einträge hinzufügen","b_sum":"{0} Zeilen sind in Ordnung, {1} haben Probleme.","b_line":"Zeile {0}: {1}","b_e_sep":"Trennzeichen fehlt (Tabulator, „;“ oder „=“)","b_e_headword":"leeres oder zu langes Wort","b_e_gloss":"leere oder zu lange Bedeutung","b_e_many":"mehr als 200 Zeilen; der Rest wird ignoriert","b_e_dup":"schon im Wörterbuch oder in Ihrer Liste","b_added":"{0} Einträge hinzugefügt, {1} übersprungen.","x_title":"Export für Lernende","x_intro":"TSV öffnet sich in jeder Tabellenkalkulation. Die Anki-Datei wird in Anki importiert (Datei → Importieren): Vorderseite ist das Wort, Rückseite sind die Bedeutungen.","x_scope_l":"Einträge zum Exportieren","x_all":"Das Wörterbuch und Ihre Liste","x_dict":"Nur das Wörterbuch","x_mine":"Nur Ihre Liste","x_tsv":"TSV herunterladen","x_anki":"Anki-Datei herunterladen","x_count":"{0} Einträge werden exportiert.","x_none":"Es gibt nichts zu exportieren.","x_done":"Datei heruntergeladen: {0}","gd_title":"So können Sie beitragen (ohne Programmieren)","gd_1":"Wählen Sie im Reiter „Hinzufügen“ die Sprache und schreiben Sie dann das Wort und seine Bedeutung.","gd_2":"Schreiben Sie unter „Quelle“, woher Sie das Wort kennen (ein Buch, eine Aufnahme, eine Person und ihr Dorf). Ohne Quelle wird der Eintrag nicht angenommen.","gd_3":"Wenn möglich, nehmen Sie das Wort auf: „Aufnehmen“ drücken, es einmal ruhig sagen, dann „Stopp“ drücken. Höchstens 50 KB.","gd_4":"Drücken Sie „Prüfen“ und dann „Zu meiner Liste hinzufügen“. Wiederholen Sie das für jedes Wort oder fügen Sie unter „Viele Wörter auf einmal hinzufügen“ eine ganze Liste ein.","gd_5":"Drücken Sie „Alles herunterladen“ und senden Sie die Datei an das Projekt: Eröffnen Sie ein Issue oder einen Pull Request auf GitHub und hängen Sie sie an, oder schicken Sie sie per E-Mail.","gd_6":"Ein Maintainer macht daraus mit scripts/import_bundle.py Datendateien; Ihr Name kommt auf Wunsch in die Liste der Mitwirkenden.","gd_st_h":"Was die Zuverlässigkeitsstufen bedeuten","gd_st_draft":"Entwurf: eingegeben, noch von niemand anderem geprüft.","gd_st_sourced":"Mit Quelle: aus einer veröffentlichten Quelle übernommen, die unter „Quelle“ steht (mit Webadresse).","gd_st_reviewed":"Geprüft: von einem Sprecher bestätigt, dessen Name unter „Geprüft von“ steht.","gd_rec_h":"Tipps zur Aufnahme","gd_rec_1":"Ein ruhiger Raum; das Mikrofon von Handy oder Headset etwa eine Handbreit vom Mund entfernt.","gd_rec_2":"Ein Wort, natürlich gesprochen, mit einer halben Sekunde Stille davor und danach; höchstens {0} Sekunden.","gd_rec_3":"Safari nimmt in einem anderen Format auf: Nehmen Sie in Chrome, Edge oder Firefox auf oder laden Sie eine mit einer anderen App erstellte Opus-Datei hoch.","gd_lic_h":"Lizenz und Datenschutz","gd_lic":"Ihr Beitrag wird unter der Projektlizenz veröffentlicht, sofern Sie unter „Lizenz“ keine andere angeben. Nehmen Sie sich selbst oder jemanden auf, der zugestimmt hat. Von dieser Seite wird nichts gesendet.","e_big":"Die Datei ist zu groß (höchstens 8 MB).","e_read":"Die Datei konnte nicht gelesen werden.","e_quota":"Der Browser-Speicher ist voll: Laden Sie die Liste herunter und löschen Sie, was Sie nicht mehr brauchen.","e_format":"Das ist keine GLOSAR-Beitragsdatei (Format glosar-bundle, Version 1).","e_many":"Die Datei hat zu viele Einträge (höchstens 500).","l_ro":"Rumänisch","l_en":"Englisch","l_hu":"Ungarisch","l_fr":"Französisch","l_de":"Deutsch","l_it":"Italienisch","l_es":"Spanisch","l_pt":"Portugiesisch","h_limits":"Grenzen und was die App nicht tut","lim_1":"Die mitgelieferten Listen sind Startmaterial: Zahlwörter und einige Wörter, jeweils auf eine veröffentlichte Quelle zurückgeführt (Wikipedia, Wiktionary, das Angloromani-Wörterbuch auf kratylos.org) und als „mit Quelle“ markiert. Noch kein Sprecher hat sie geprüft.","lim_2":"Aromunisch, Meglenorumänisch und Romani haben nur je eine Handvoll Wörter, Istrorumänisch noch keines. Die Grundliste mit 50 Konzepten ist bei Weitem nicht abgedeckt (siehe Reiter „Abdeckung“).","lim_3":"Schreibsysteme unterscheiden sich je nach Quelle und Sprecher: Die Einträge nennen das verwendete System und führen andere Schreibweisen als Varianten auf. Die Suche ignoriert Diakritika („tinti“ findet „ținți“), weiß aber nicht, dass zwei Schreibweisen dasselbe Wort sind, wenn es keine Variante sagt.","lim_4":"Für die Aufnahme braucht es einen Browser, der Opus aufnimmt (Chrome, Edge, Firefox). Safari nimmt in einem anderen Format auf: Verwenden Sie dann eine Opus-Datei. Aufnahmen sind auf 50 KB begr
